
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>導遊考試刷題 V18</title>
<style>
body{font-family:Arial;background:#f3f4f6;padding:20px}
.box{max-width:900px;margin:auto;background:#fff;padding:20px;border-radius:12px}
.q{font-size:26px;font-weight:bold;margin:20px 0}
.answer{padding:14px;margin:6px 0;background:#e5e7eb;border-radius:10px;cursor:pointer}
.correct{background:#fde047}
.wrong{background:#fca5a5}
</style>
</head>
<body>
<div class="box">
<h1>導遊考試刷題 V18</h1>
<div id="progress"></div>
<div id="q" class="q"></div>
<div id="answers"></div>
<button onclick="next()">下一題</button>
</div>

<script src="questions.js"></script>
<script>
let quiz=[...questions].sort(()=>Math.random()-0.5)
let i=0

function show(){
let q=quiz[i]
document.getElementById("progress").innerText="第 "+(i+1)+" 題"
document.getElementById("q").innerText=q.q

let a=document.getElementById("answers")
a.innerHTML=""
q.options.forEach((opt,idx)=>{
let b=document.createElement("div")
b.className="answer"
b.innerText=opt
b.onclick=()=>{
if(idx===q.answer){b.classList.add("correct")}
else{b.classList.add("wrong")}
}
a.appendChild(b)
})
}

function next(){
i++
if(i>=quiz.length)i=0
show()
}

show()
</script>
</body>
</html>
