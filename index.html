<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>導遊考試刷題 V21</title>
<style>
body{
  font-family:Arial,sans-serif;
  background:#f3f4f6;
  margin:0;
  padding:20px;
}
.box{
  max-width:900px;
  margin:auto;
  background:#fff;
  padding:24px;
  border-radius:16px;
  box-shadow:0 8px 24px rgba(0,0,0,.08);
}
h1{
  text-align:center;
  margin-bottom:16px;
}
.toolbar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  justify-content:center;
  margin-bottom:14px;
}
select,button{
  padding:10px 12px;
  font-size:16px;
  border-radius:10px;
  border:1px solid #ccc;
}
button{
  cursor:pointer;
}
.timer{
  text-align:center;
  font-size:22px;
  color:#dc2626;
  margin:10px 0;
  font-weight:bold;
}
.meta{
  display:flex;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:10px;
  color:#555;
  font-size:18px;
}
.q{
  font-size:28px;
  font-weight:bold;
  margin:20px 0;
  line-height:1.5;
}
.answers{
  display:grid;
  gap:12px;
}
.answer-btn{
  padding:16px;
  font-size:20px;
  border:none;
  border-radius:12px;
  background:#e5e7eb;
  cursor:pointer;
}
.answer-btn:hover{
  background:#d1d5db;
}
.correct{
  background:#fde047 !important;
}
.wrong{
  background:#fca5a5 !important;
}
.controls{
  text-align:center;
  margin-top:18px;
}
.next-btn{
  background:#2563eb;
  color:#fff;
  border:none;
  padding:14px 18px;
  border-radius:12px;
  font-size:18px;
}
.summary{
  margin-top:20px;
  padding:14px;
  border:1px solid #ddd;
  border-radius:10px;
  background:#fafafa;
  line-height:1.8;
  font-size:18px;
}
</style>
</head>
<body>
<div class="box">

  <h1>導遊考試刷題</h1>

  <div class="toolbar">
    <select id="subject" onchange="startQuiz()">
      <option value="resource">觀光資源</option>
      <option value="law">法規行政</option>
      <option value="practice">導遊實務</option>
      <option value="all">全部隨機</option>
    </select>

    <select id="count" onchange="startQuiz()">
      <option value="10">練習 10 題</option>
      <option value="50">模擬考 50 題</option>
    </select>
  </div>

  <div class="timer" id="timerBox" style="display:none;">
    剩餘時間 <span id="timerText"></span>
  </div>

  <div class="meta">
    <div id="progress"></div>
    <div id="score"></div>
  </div>

  <div class="q" id="question"></div>

  <div class="answers">
    <button class="answer-btn" id="btn0" onclick="selectAnswer(0)"></button>
    <button class="answer-btn" id="btn1" onclick="selectAnswer(1)"></button>
    <button class="answer-btn" id="btn2" onclick="selectAnswer(2)"></button>
    <button class="answer-btn" id="btn3" onclick="selectAnswer(3)"></button>
  </div>

  <div class="controls">
    <button class="next-btn" onclick="nextQuestion()">下一題</button>
  </div>

  <div class="summary" id="summary"></div>

</div>

<script src="questions.js"></script>
<script>
let quiz = [];
let current = 0;
let score = 0;
let answerOrder = [0,1,2,3];
let locked = false;
let timer = null;
let timeLeft = 0;

function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function startTimer(minutes){
  clearInterval(timer);
  timeLeft = minutes * 60;
  document.getElementById("timerBox").style.display = "block";
  updateTimer();
  timer = setInterval(()=>{
    timeLeft--;
    updateTimer();
    if(timeLeft <= 0){
      clearInterval(timer);
      finishQuiz();
    }
  },1000);
}

function updateTimer(){
  const m = Math.floor(timeLeft/60);
  const s = timeLeft%60;
  document.getElementById("timerText").innerText =
    String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0");
}

function startQuiz(){
  const subject = document.getElementById("subject").value;
  const count = parseInt(document.getElementById("count").value,10);

  let pool = [];
  if(subject === "all"){
    pool = [...questions];
  }else{
    pool = questions.filter(q => q.subject === subject);
  }

  quiz = shuffle(pool).slice(0, Math.min(count, pool.length));
  current = 0;
  score = 0;
  locked = false;
  document.getElementById("summary").innerHTML = "";

  if(count === 50){
    startTimer(60);
  }else{
    clearInterval(timer);
    document.getElementById("timerBox").style.display = "none";
  }

  render();
}

function render(){
  if(!quiz.length){
    document.getElementById("question").innerText = "目前沒有題目";
    return;
  }

  const q = quiz[current];
  answerOrder = shuffle([0,1,2,3]);
  locked = false;

  document.getElementById("progress").innerText = `第 ${current+1} / ${quiz.length} 題`;
  document.getElementById("score").innerText = `答對 ${score} 題`;
  document.getElementById("question").innerText = q.q;

  for(let i=0;i<4;i++){
    const btn = document.getElementById("btn"+i);
    btn.innerText = q.options[answerOrder[i]];
    btn.disabled = false;
    btn.className = "answer-btn";
  }
}

function selectAnswer(i){
  if(locked) return;
  locked = true;

  const q = quiz[current];
  const picked = answerOrder[i];
  const correctBtn = answerOrder.indexOf(q.answer);

  for(let j=0;j<4;j++){
    document.getElementById("btn"+j).disabled = true;
  }

  if(picked === q.answer){
    document.getElementById("btn"+i).classList.add("correct");
    score++;
  }else{
    document.getElementById("btn"+i).classList.add("wrong");
    document.getElementById("btn"+correctBtn).classList.add("correct");
  }

  document.getElementById("score").innerText = `答對 ${score} 題`;
}

function nextQuestion(){
  if(!quiz.length) return;

  current++;
  if(current >= quiz.length){
    finishQuiz();
    return;
  }
  render();
}

function finishQuiz(){
  clearInterval(timer);
  const total = quiz.length;
  const wrong = total - score;
  const rate = total ? Math.round(score / total * 100) : 0;

  document.getElementById("summary").innerHTML =
    `測驗完成<br>總題數：${total}<br>答對：${score}<br>答錯：${wrong}<br>正確率：${rate}%`;
}

startQuiz();
</script>
</body>
</html>
