<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>導遊考試刷題</title>
<style>
body{
  font-family:Arial,sans-serif;
  background:#f3f4f6;
  margin:0;
  padding:20px;
}
.box{
  max-width:900px;
  margin:auto;
  background:#fff;
  padding:24px;
  border-radius:16px;
  box-shadow:0 8px 24px rgba(0,0,0,.08);
}
h1{
  text-align:center;
  margin:0 0 16px 0;
}
.toolbar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  justify-content:center;
  margin-bottom:14px;
}
select,button{
  padding:10px 12px;
  font-size:16px;
  border-radius:10px;
  border:1px solid #ccc;
  background:#fff;
}
button{
  cursor:pointer;
}
.meta{
  display:flex;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
  color:#555;
  font-size:18px;
  margin-bottom:10px;
}
.timer{
  text-align:center;
  font-size:22px;
  font-weight:bold;
  color:#dc2626;
  margin:10px 0 14px 0;
  display:none;
}
.q{
  font-size:28px;
  font-weight:bold;
  line-height:1.5;
  margin:20px 0;
  min-height:56px;
}
.answers{
  display:grid;
  gap:12px;
}
.answer-btn{
  padding:16px;
  font-size:20px;
  border:none;
  border-radius:12px;
  background:#e5e7eb;
  cursor:pointer;
}
.answer-btn:hover{
  background:#d1d5db;
}
.correct{
  background:#fde047 !important;
  color:#111 !important;
}
.wrong{
  background:#fca5a5 !important;
  color:#111 !important;
}
.controls{
  text-align:center;
  margin-top:18px;
}
.next-btn{
  background:#2563eb;
  color:#fff;
  border:none;
  padding:14px 18px;
  border-radius:12px;
  font-size:18px;
}
.summary{
  margin-top:18px;
  padding:14px;
  border:1px solid #ddd;
  border-radius:12px;
  background:#fafafa;
  font-size:18px;
  line-height:1.8;
  min-height:28px;
}
@media (max-width:600px){
  .q{font-size:24px;}
  .answer-btn{font-size:18px;}
}
</style>
</head>
<body>
<div class="box">

  <h1>導遊考試刷題</h1>

  <div class="toolbar">
    <select id="subject" onchange="startQuiz()">
      <option value="all">全部隨機</option>
      <option value="resource">觀光資源</option>
      <option value="law">法規行政</option>
      <option value="practice">導遊實務</option>
    </select>

    <select id="count" onchange="startQuiz()">
      <option value="10">練習 10 題</option>
      <option value="50">模擬考 50 題</option>
    </select>
  </div>

  <div class="timer" id="timerBox">
    剩餘時間 <span id="timerText">60:00</span>
  </div>

  <div class="meta">
    <div id="progress"></div>
    <div id="score"></div>
  </div>

  <div class="q" id="question">載入中...</div>

  <div class="answers">
    <button class="answer-btn" id="a0" onclick="answer(0)"></button>
    <button class="answer-btn" id="a1" onclick="answer(1)"></button>
    <button class="answer-btn" id="a2" onclick="answer(2)"></button>
    <button class="answer-btn" id="a3" onclick="answer(3)"></button>
  </div>

  <div class="controls">
    <button class="next-btn" onclick="nextQuestion()">下一題</button>
  </div>

  <div class="summary" id="summary"></div>

</div>

<script src="questions.js"></script>
<script>
let pool = [];
let currentIndex = 0;
let score = 0;
let order = [0,1,2,3];
let locked = false;
let timer = null;
let timeLeft = 0;

function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random() * (i+1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function getCurrentQuestion(){
  return pool[currentIndex];
}

function updateMeta(){
  document.getElementById("progress").innerText = `第 ${currentIndex + 1} / ${pool.length} 題`;
  document.getElementById("score").innerText = `答對 ${score} 題`;
}

function updateTimer(){
  const m = Math.floor(timeLeft / 60);
  const s = timeLeft % 60;
  document.getElementById("timerText").innerText =
    String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0");
}

function startTimer(){
  clearInterval(timer);
  timeLeft = 60 * 60;
  document.getElementById("timerBox").style.display = "block";
  updateTimer();
  timer = setInterval(() => {
    timeLeft--;
    updateTimer();
    if(timeLeft <= 0){
      clearInterval(timer);
      finishQuiz();
    }
  }, 1000);
}

function stopTimer(){
  clearInterval(timer);
  document.getElementById("timerBox").style.display = "none";
}

function render(){
  if(!pool.length){
    document.getElementById("question").innerText = "沒有可用題目";
    for(let i=0;i<4;i++){
      document.getElementById("a"+i).innerText = "";
      document.getElementById("a"+i).disabled = true;
    }
    return;
  }

  const q = getCurrentQuestion();
  locked = false;
  order = shuffle([0,1,2,3]);
  updateMeta();
  document.getElementById("summary").innerText = "";
  document.getElementById("question").innerText = q.q;

  for(let i=0;i<4;i++){
    const btn = document.getElementById("a"+i);
    btn.className = "answer-btn";
    btn.disabled = false;
    btn.innerText = q.options[order[i]];
  }
}

function answer(i){
  if(locked) return;
  locked = true;

  const q = getCurrentQuestion();
  const picked = order[i];
  const correctButton = order.indexOf(q.answer);

  for(let j=0;j<4;j++){
    document.getElementById("a"+j).disabled = true;
  }

  if(picked === q.answer){
    document.getElementById("a"+i).classList.add("correct");
    score++;
    document.getElementById("summary").innerText = "✅ 正確";
  }else{
    document.getElementById("a"+i).classList.add("wrong");
    document.getElementById("a"+correctButton).classList.add("correct");
    document.getElementById("summary").innerText = "❌ 錯誤，正確答案：" + q.options[q.answer];
  }

  updateMeta();
}

function nextQuestion(){
  if(!pool.length) return;

  currentIndex++;
  if(currentIndex >= pool.length){
    finishQuiz();
    return;
  }
  render();
}

function finishQuiz(){
  const total = pool.length;
  const wrong = total - score;
  const rate = total ? Math.round((score / total) * 100) : 0;

  stopTimer();

  document.getElementById("question").innerText = "測驗完成";
  for(let i=0;i<4;i++){
    const btn = document.getElementById("a"+i);
    btn.innerText = "";
    btn.disabled = true;
    btn.className = "answer-btn";
  }

  document.getElementById("summary").innerHTML =
    `總題數：${total}<br>答對：${score}<br>答錯：${wrong}<br>正確率：${rate}%`;

  document.getElementById("progress").innerText = "已完成";
}

function startQuiz(){
  if(typeof questions === "undefined" || !Array.isArray(questions)){
    document.getElementById("question").innerText = "questions.js 沒有成功載入";
    return;
  }

  const subject = document.getElementById("subject").value;
  const count = parseInt(document.getElementById("count").value, 10);

  let source = subject === "all"
    ? [...questions]
    : questions.filter(q => q.subject === subject);

  source = shuffle(source);
  pool = source.slice(0, Math.min(count, source.length));

  currentIndex = 0;
  score = 0;

  if(count === 50){
    startTimer();
  }else{
    stopTimer();
  }

  render();
}

startQuiz();
</script>
</body>
</html>
